<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" /><link rel="icon" type="image/png" href="/icon.png" /><link rel="apple-touch-icon" href="/icon.png" /><link rel="manifest" href="/manifest.json" /><meta name="theme-color" content="#2563eb" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VenxPos — Punto de Venta</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eff6ff 0%, #f1f5f9 100%);
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.3s ease-out;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-card {
        text-align: center;
      }
      .splash-logo {
        margin: 0 auto 24px;
        max-width: 260px;
      }
      .splash-logo img {
        width: 100%;
        height: auto;
        display: block;
      }
      .splash-title {
        font-size: 28px;
        font-weight: 700;
        color: #111827;
        margin: 0 0 8px 0;
        letter-spacing: -0.5px;
      }
      .splash-subtitle {
        font-size: 13px;
        color: #6b7280;
        margin: 0 0 32px 0;
        font-weight: 500;
      }
      .splash-loader {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .splash-loader .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #93c5fd;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      .splash-loader .dot:nth-child(2) { animation-delay: 0.15s; }
      .splash-loader .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-pulse {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; background: #2563eb; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-card">
        <div class="splash-logo">
          <img src="/logo-pos.png" alt="VENXPOS" />
        </div>
        <h1 class="splash-title">VenxPos</h1>
        <p class="splash-subtitle">Iniciando sistema...</p>
        <div class="splash-loader">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
